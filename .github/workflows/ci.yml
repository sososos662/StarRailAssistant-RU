name: Fork offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install ".[full,dev]" flake8
      - name: Blocking syntax and undefined-name checks
        run: python -m flake8 SRACore extensions tasks tests scripts main.py --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Offline tests with isolated state
        run: python scripts/check_offline.py --output "${{ runner.temp }}/sra-checks" tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-test-results
          path: ${{ runner.temp }}/sra-checks/pytest.*
          if-no-files-found: ignore
          retention-days: 7

  webui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: SRAFrontend/srafrontend-webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Use the project's pinned package manager
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxlint .
      - run: pnpm exec eslint .
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build

  dotnet:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - run: dotnet build SRAFrontend/SRAFrontend.Desktop/SRAFrontend.Desktop.csproj -c Release
      - run: dotnet build SRAFrontend/SRAFrontend.Server/SRAFrontend.Server.csproj -c Release
