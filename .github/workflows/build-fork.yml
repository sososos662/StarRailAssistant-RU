name: Manual fork build (artifacts only)

on:
  workflow_dispatch:
    inputs:
      ocr:
        description: OCR payload
        type: choice
        options: [directml, cpu]
        default: directml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: python -m pip install ".[full,dev]" nuitka ordered-set zstandard flake8
      - run: python -m flake8 SRACore extensions tasks tests scripts main.py --select=E9,F63,F7,F82
      - run: python scripts/check_offline.py --output "${{ runner.temp }}/sra-tests" tests
      - name: Fresh local build; explicit downloads, no release API
        env:
          FORK_OCR: ${{ inputs.ocr }}
        shell: pwsh
        run: python scripts/build_ru.py --output "${{ runner.temp }}/sra-build" --ocr $env:FORK_OCR --allow-downloads
      - uses: actions/upload-artifact@v4
        with:
          name: fork-windows-x64-${{ inputs.ocr }}
          path: |
            ${{ runner.temp }}/sra-build/artifacts/*
          if-no-files-found: error
          retention-days: 14
